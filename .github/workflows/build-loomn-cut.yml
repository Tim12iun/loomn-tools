name: Build Loomn Cut (Mac)

# Baut Loomn Cut aus dem privaten Repo loomn-cam und veröffentlicht es hier als Release.
# Öffentliches Repo = kostenlose Actions-Minuten. Der Code bleibt privat; gelesen wird er
# mit dem Secret LOOMN_CAM_TOKEN (nur Lesezugriff auf loomn-cam).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Auch bauen, wenn sich nichts geändert hat"
        type: boolean
        default: false
      ref:
        description: "Anderer Zweig von loomn-cam (nur Testbau, kein Update an die App)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: loomn-cut
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SRC_REPO: Tim12iun/loomn-cam
  SRC_REF: ${{ inputs.ref || vars.LOOMN_CUT_REF || 'claude/project-thread-7iorot' }}
  # Nur der Hauptzweig wird als Update veröffentlicht, andere Zweige sind Testbauten
  PUBLISH: ${{ inputs.ref == '' || inputs.ref == null }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      build: ${{ steps.c.outputs.build }}
      changed: ${{ steps.c.outputs.changed }}
      prevsha: ${{ steps.c.outputs.prevsha }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          SRC_TOKEN: ${{ secrets.LOOMN_CAM_TOKEN }}
        run: |
          if [ -z "$SRC_TOKEN" ]; then echo "::error::Secret LOOMN_CAM_TOKEN fehlt in loomn-tools (Settings → Secrets and variables → Actions)"; exit 1; fi
          # letzter Commit, der LoomnCut/ ändert (andere Änderungen lösen kein Update aus)
          sha=$(GH_TOKEN="$SRC_TOKEN" gh api "repos/$SRC_REPO/commits?sha=$SRC_REF&path=LoomnCut&per_page=1" -q '.[0].sha') || {
            echo "::error::LOOMN_CAM_TOKEN kann $SRC_REPO (Zweig $SRC_REF) nicht lesen: Schlüssel braucht Zugriff auf loomn-cam mit Contents: Read-only"; exit 1; }
          # höchste Build-Nummer unter den Tags loomn-cut-b<N>
          prev=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/loomn-cut-b" -q '.[].ref' | sed 's#refs/tags/##' | sort -t b -k2 -n | tail -1)
          prevsha=""; prevbuild=0
          if [ -n "$prev" ]; then
            gh release download "$prev" -R "$GITHUB_REPOSITORY" -p version.json -O prev.json
            prevsha=$(jq -r '.commit // empty' prev.json)
            prevbuild=$(jq -r '.build // 0' prev.json)
          fi
          changed=false
          if [ "$sha" != "$prevsha" ] || [ "${{ inputs.force }}" = "true" ] || [ "$PUBLISH" != "true" ]; then changed=true; fi
          echo "Quelle $sha, letztes Release $prev ($prevsha), neu bauen: $changed"
          { echo "sha=$sha"; echo "prevsha=$prevsha"; echo "build=$((prevbuild + 1))"; echo "changed=$changed"; } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ needs.check.outputs.build }}
      SHA: ${{ needs.check.outputs.sha }}
      PREVSHA: ${{ needs.check.outputs.prevsha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.LOOMN_CAM_TOKEN }}
          fetch-depth: 0
          path: src

      - name: Versionen
        run: xcodebuild -version && swift --version && sw_vers

      - name: App bauen
        working-directory: src/LoomnCut
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: scripts/build-app.sh 2>&1 | tee build.log

      - name: Selbsttest (Cutpoints, Zeitlupe)
        working-directory: src/LoomnCut
        run: build/LoomnCut.app/Contents/MacOS/LoomnCut --selftest "$RUNNER_TEMP/selftest" 2>&1 | tee selftest.log

      - uses: actions/upload-artifact@v4
        with:
          name: LoomnCut-app
          path: src/LoomnCut/build/LoomnCut.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loomn-cut-logs
          path: |
            src/LoomnCut/build.log
            src/LoomnCut/selftest.log
          retention-days: 7

  # Stummer Selbsttest derselben App auf einem Intel-Mac (ohne Apple-KI): prüft den Intel-Teil
  # und die Zwischenbilder per Bewegungsschätzung. Ohne grünes Ergebnis wird nichts veröffentlicht.
  intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LoomnCut-app
          path: app

      - name: Versionen
        run: sw_vers && uname -m

      - name: Selbsttest auf Intel
        run: |
          ditto -x -k app/LoomnCut.zip app
          lipo -info app/LoomnCut.app/Contents/MacOS/LoomnCut
          app/LoomnCut.app/Contents/MacOS/LoomnCut --selftest "$RUNNER_TEMP/selftest" 2>&1 | tee selftest-intel.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loomn-cut-intel-logs
          path: selftest-intel.log
          retention-days: 7

  publish:
    needs: [check, build, intel]
    if: needs.check.outputs.changed == 'true' && (inputs.ref == '' || inputs.ref == null)
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.check.outputs.build }}
      SHA: ${{ needs.check.outputs.sha }}
      PREVSHA: ${{ needs.check.outputs.prevsha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.LOOMN_CAM_TOKEN }}
          fetch-depth: 0
          path: src

      - uses: actions/download-artifact@v4
        with:
          name: LoomnCut-app
          path: app

      - name: Update als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src
          if [ -n "$PREVSHA" ] && git cat-file -e "$PREVSHA" 2>/dev/null; then range="$PREVSHA..HEAD"; else range="-8"; fi
          notes=$(git log $range --no-merges --format=%s -- LoomnCut | head -12 | jq -R . | jq -s .)
          cd ..
          mkdir out && cp app/LoomnCut.zip out/
          jq -n --arg v "1.0" --argjson b "$BUILD" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --argjson n "$notes" --arg s "$(shasum -a 256 out/LoomnCut.zip | cut -d' ' -f1)" --arg c "$SHA" \
                '{name:"LoomnCut", version:$v, build:$b, date:$d, notes:$n, sha256:$s, file:"LoomnCut.zip", commit:$c}' > out/version.json
          cat out/version.json
          jq -r '.notes | map("- " + .) | join("\n")' out/version.json > out/notes.md
          gh release create "loomn-cut-b$BUILD" out/LoomnCut.zip out/version.json \
            -R "$GITHUB_REPOSITORY" --title "Loomn Cut 1.0 (Build $BUILD)" --notes-file out/notes.md
