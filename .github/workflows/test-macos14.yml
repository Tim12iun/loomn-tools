name: Mac-Tools starten (Apple-Chip und Intel)

# Lädt die aktuelle Version jedes Mac-Tools aus den Releases und startet sie auf einem
# Apple-Chip- und einem Intel-Mac und prüft, dass sie ab macOS 14 freigegeben sind.
# (GitHub hat keine macOS-14-Maschinen mehr.) Rot = das Tool startet dort nicht.
on:
  workflow_dispatch:
    inputs:
      cut_run:
        description: "Lauf-ID eines Loomn-Cut-Testbaus (statt des letzten Release)"
        type: string
        default: ""
  push:
    branches: ["claude/macos14-test"]

permissions:
  contents: read

jobs:
  start:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        tool:
          - { prefix: loomn-cut-b, zip: LoomnCut.zip, selftest: true }
          - { prefix: loomn-archiv-b, zip: LoomnArchiv.zip, repo: Tim12iun/loomn-archiv }
          - { prefix: beatmosh-v, zip: Beatmosh.zip }
          - { prefix: buildn-v, zip: Buildn.zip }
          - { prefix: plugn-v, zip: Plugn.zip }
    steps:
      - name: System
        run: sw_vers && uname -m
      - name: Neueste Version laden
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.tool.repo || github.repository }}
        run: |
          tag=$(gh api "repos/$REPO/releases?per_page=100" --paginate -q '.[].tag_name' \
                | grep -E "^${{ matrix.tool.prefix }}[0-9.]+$" | sort -V | tail -1)
          if [ -n "${{ inputs.cut_run }}" ] && [ "${{ matrix.tool.zip }}" = "LoomnCut.zip" ]; then
            echo "Testbau aus Lauf ${{ inputs.cut_run }}"
            gh run download "${{ inputs.cut_run }}" -R "$GITHUB_REPOSITORY" -n LoomnCut-app -D dl
          else
            echo "Release: $tag"
            gh release download "$tag" -R "$REPO" -p "${{ matrix.tool.zip }}" -D dl
          fi
          cd dl && ditto -x -k "${{ matrix.tool.zip }}" . && ls
      - name: Mindest-macOS
        run: |
          app=$(ls -d dl/*.app | head -1); echo "APP=$app" >> "$GITHUB_ENV"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          lipo -info "$app/Contents/MacOS/$exe"
          vtool -show-build "$app/Contents/MacOS/$exe" | grep -E "minos|sdk"
          if vtool -show-build "$app/Contents/MacOS/$exe" | awk '/minos/{split($2,v,"."); if (v[1]>14) bad=1} END{exit !bad}'; then
            echo "::error::verlangt neueres macOS als 14"; exit 1; fi
          xcrun dyld_info -dependents "$app/Contents/MacOS/$exe" 2>/dev/null | head -60 || otool -L "$app/Contents/MacOS/$exe"
      - name: Selbsttest
        if: matrix.tool.selftest
        run: |
          set -o pipefail
          "$APP/Contents/MacOS/$EXE" --selftest "$RUNNER_TEMP/selftest" 2>&1 | tail -40
      - name: Starten (20 s)
        run: |
          set +e
          xattr -cr "$APP"
          log="$RUNNER_TEMP/out.log"
          "$APP/Contents/MacOS/$EXE" >"$log" 2>&1 &
          pid=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/bild.png" || true
          if kill -0 $pid 2>/dev/null; then
            echo "Läuft nach 20 s noch: OK"; kill $pid
          else
            wait $pid; code=$?
            echo "::error::$EXE ist beendet (Code $code)"; cat "$log"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -3 | while read f; do head -80 ~/Library/Logs/DiagnosticReports/"$f"; done
            exit 1
          fi
          tail -30 "$log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bild-${{ matrix.os }}-${{ matrix.tool.prefix }}
          path: ${{ runner.temp }}/bild.png
          retention-days: 7
